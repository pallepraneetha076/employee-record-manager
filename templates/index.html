<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Record Manager</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <h1>Employee Record Manager</h1>

        <form>

            <label>Employee ID:</label><br>
            <input type="text" placeholder="Enter Employee ID"><br>

            <label>Employee Name:</label><br>
            <input type="text" placeholder="Enter Employee Name"><br>

            <label>Department:</label><br>
            <input type="text" placeholder="Enter Department"><br>

            <label>Search Employee:</label><br>
            <input type="text" placeholder="Search Employee"><br>

            <button type="submit">Add Employee</button>

        </form>

    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
